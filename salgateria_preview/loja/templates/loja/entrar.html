{% extends "loja/base.html" %}
{% block conteudo %}
<div class="caixa" style="max-width:320px;margin:auto">
  <h2>Entrar</h2>
  {% if form.errors %}<div class="msg">Usuário ou senha incorretos.</div>{% endif %}
  <form method="post">{% csrf_token %}
    <p><label>Usuário<br>{{ form.username }}</label></p>
    <p><label>Senha<br>{{ form.password }}</label></p>
    <button class="b">Entrar</button>
  </form>
  <p><small>Teste: carla / demo1234</small></p>
</div>
{% endblock %}
