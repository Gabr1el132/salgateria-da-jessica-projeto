<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salgateria da Jéssica</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; color: #222; }
    header { background: #b5541c; color: #fff; padding: 10px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    header a, header button { color: #fff; text-decoration: none; background: none; border: 0; font: inherit; cursor: pointer; }
    header .titulo { font-weight: bold; font-size: 1.1em; margin-right: auto; }
    main { max-width: 900px; margin: 20px auto; padding: 0 16px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
    input, select, button.b { padding: 6px 10px; font: inherit; }
    button.b { background: #b5541c; color: #fff; border: 0; border-radius: 3px; cursor: pointer; }
    button.b.cinza { background: #777; }
    .msg { padding: 8px 12px; margin-bottom: 10px; background: #fde2e2; border: 1px solid #e5a0a0; }
    .caixa { background: #fff; padding: 12px; margin-bottom: 16px; border: 1px solid #ddd; }
    .dir { text-align: right; }
    form.inline { display: inline; }
  </style>
</head>
<body>
  <header>
    <span class="titulo">Salgateria da Jéssica</span>
    {% if user.is_authenticated %}
      <a href="{% url 'pedido' %}">Venda</a>
      <a href="{% url 'vendas' %}">Vendas</a>
      <a href="{% url 'estoque' %}">Estoque</a>
      {% if user.is_superuser %}<a href="/admin/">Admin</a>{% endif %}
      <form method="post" action="{% url 'sair' %}" class="inline">{% csrf_token %}
        <button>Sair ({{ user.username }})</button>
      </form>
    {% endif %}
  </header>
  <main>
    {% for m in messages %}<div class="msg">{{ m }}</div>{% endfor %}
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
